<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Small Phoenix — an illustrated map of Tempe, Sky Harbor and downtown, with live Valley Metro</title>
<meta name="description" content="An illustrated, isometric map of ASU, the Valley Metro Rail corridor and downtown Phoenix you can drag and zoom through, with every light rail train, streetcar and bus live.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2420; --paper: #efe7da; --card: rgba(255, 252, 246, .94); --rail-a: #1e8ecd; --rail-b: #b76912; --streetcar: #6d8932; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; }
  #layer { position: fixed; inset: 0; pointer-events: none; }
  .ui { position: fixed; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .ui.tl { top: 14px; left: 14px; max-width: 320px; }
  .ui.tr { top: 14px; right: 14px; align-items: flex-end; }
  .ui.br { right: 14px; bottom: 14px; align-items: flex-end; }
  .card { background: var(--card); backdrop-filter: blur(8px); border: 1px solid rgba(43, 36, 32, .12); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(43, 36, 32, .12); }
  h1 { font: 500 24px/1.1 Fraunces, Georgia, serif; margin: 0 0 2px; letter-spacing: -.01em; }
  .sub { color: #6b5f55; font-size: 12.5px; }
  .toggles label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .toggles input { accent-color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .btn { background: var(--card); border: 1px solid rgba(43, 36, 32, .14); border-radius: 999px; padding: 7px 12px; cursor: pointer; font: inherit; font-weight: 500; color: var(--ink); box-shadow: 0 4px 14px rgba(43, 36, 32, .1); }
  .btn:hover { background: #fff; }
  #status { font-size: 12px; color: #6b5f55; }
  #follow { display: none; }
  #follow.on { display: block; }
  #vcard { display: none; min-width: 220px; }
  #vcard.on { display: block; }
  #vcard .name { font-weight: 600; font-size: 15px; }
  #vcard .pill { display: inline-block; color: #fff; border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 12px; margin-right: 6px; }
  .row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 6px 8px; align-items: center; padding: 3px 0; border-top: 1px solid rgba(43,36,32,.08); font-size: 13px; }
  .row .eta { font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .dest { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tip { position: fixed; display: none; z-index: 6; pointer-events: none; background: var(--card); border: 1px solid rgba(43,36,32,.14); border-radius: 8px; padding: 5px 9px; font: 500 13px Inter, sans-serif; color: var(--ink); box-shadow: 0 4px 14px rgba(43,36,32,.12); white-space: nowrap; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: #6b5f55; flex-wrap: wrap; }
  .legend span { display: flex; gap: 5px; align-items: center; }
  .about { font-size: 12.5px; color: #6b5f55; }
  .about a { color: inherit; }
  @media (max-width: 640px) { .ui.tl { max-width: calc(100vw - 28px); } h1 { font-size: 20px; } .sub { display: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
<script src="/geo.js"></script>
</head><body>
<div id="map"></div><canvas id="layer"></canvas><div id="tip"></div>
<div class="ui tl">
  <div class="card">
    <h1>Small Phoenix</h1>
    <div class="sub">ASU, the rail corridor past Sky Harbor, and downtown, drawn as one picture. Every Valley Metro train, streetcar and bus is live.</div>
    <div class="toggles" style="margin-top:8px">
      <label><input type="checkbox" id="t-rail" checked><span class="dot" style="background:var(--rail-a)"></span> Light rail &amp; streetcar</label>
      <label><input type="checkbox" id="t-bus" checked><span class="dot" style="background:#5f6b7a"></span> Buses</label>
      <label><input type="checkbox" id="t-stops" checked><span class="dot" style="background:#fff;border:2px solid var(--ink);width:7px;height:7px"></span> Stations</label>
      <label><input type="checkbox" id="t-planes" checked><span class="dot" style="background:#fffdf8;border:1.5px solid var(--ink);width:8px;height:8px"></span> Planes overhead <span class="sub" id="planes-status"></span></label>
      <label><input type="checkbox" id="t-traffic" checked><span class="dot" style="background:#9ea4ab;border-radius:2px"></span> Street traffic <span class="sub">simulated</span></label>
    </div>
    <div id="status" style="margin-top:6px">Loading…</div>
  </div>
  <div id="vcard" class="card"></div>
</div>
<div class="ui tr">
  <button class="btn" id="follow">Stop following</button>
  <button class="btn" id="btn-share">Copy link</button>
</div>
<div class="ui br"><div class="card about">Streets and buildings from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · live positions from <a href="https://www.valleymetro.org/">Valley Metro</a></div></div>
<script src="/layers.js"></script><script src="/buildings.js"></script><script src="/transit.js"></script><script src="/planes.js"></script><script src="/traffic.js"></script>
<script>
(async () => {
  const mapName = new URLSearchParams(location.search).get("map") || "mill", base = `/maps/${mapName}/`;
  const [map, geo] = await Promise.all([fetch(base + "map.json").then((r) => r.json()), fetch(base + "geo.json").then((r) => r.json())]);
  if (geo.title) document.querySelector("h1").textContent = "Small Phoenix · " + geo.title;
  const mobile = matchMedia("(pointer: coarse)").matches;
  const viewer = OpenSeadragon({
    id: "map", showNavigationControl: false, drawer: mobile ? "canvas" : ["webgl", "canvas"],
    tileSources: { width: map.W, height: map.H, tileSize: map.tileSize, tileOverlap: 0, minLevel: 0, maxLevel: map.maxLevel, getTileUrl: (l, x, y) => `${map.tiles}${l}/${x}_${y}.webp?v=${map.v}` },
    maxZoomPixelRatio: 1.6, visibilityRatio: 0.7, animationTime: 0.6, springStiffness: 9, zoomPerScroll: 1.25, gestureSettingsMouse: { clickToZoom: false }, gestureSettingsTouch: { clickToZoom: false },
    imageLoaderLimit: mobile ? 4 : 8, maxImageCacheCount: mobile ? 60 : 250, preserveImageSizeOnResize: true, minZoomImageRatio: 0.5, constrainDuringPan: true,
  });
  window.viewer = viewer;
  const terrain = geo.terrain ? await IsoGeo.loadTerrain(geo, base).catch((e) => (console.warn("no terrain", e), null)) : null;   // before any layer projects a point
  const G = IsoGeo.make(geo, null, terrain);
  IsoGeo.load(geo, base).then((d) => { window.__depth = d; Object.assign(G, IsoGeo.make(geo, d, terrain)); }).catch((e) => console.warn("no depth grid", e));

  // start on ASU unless the link says otherwise (#lat,lon,zoom)
  const start = (location.hash.match(/^#(-?[\d.]+),(-?[\d.]+),([\d.]+)/) || []).slice(1).map(Number);
  viewer.addHandler("open", () => {
    const [lat, lon, z] = start.length ? start : [geo.center.lat, geo.center.lon, 3];
    const p = G.toPixel(lat, lon); viewer.viewport.zoomTo(z, null, true); viewer.viewport.panTo(viewer.viewport.imageToViewportCoordinates(p.x, p.y), true);
  });
  const linkFor = () => { const q = mapName === "mill" ? "" : `?map=${mapName}`; const c = viewer.viewport.viewportToImageCoordinates(viewer.viewport.getCenter()); const [lat, lon] = G.pixelToLatLon(c.x, c.y); return `${q}#${lat.toFixed(5)},${lon.toFixed(5)},${viewer.viewport.getZoom().toFixed(2)}`; };
  viewer.addHandler("animation-finish", () => history.replaceState(null, "", linkFor()));
  document.getElementById("btn-share").onclick = async (ev) => { await navigator.clipboard.writeText(location.origin + "/" + linkFor()); ev.target.textContent = "Copied"; setTimeout(() => (ev.target.textContent = "Copy link"), 1200); };

  const card = document.getElementById("vcard"), followBtn = document.getElementById("follow");
  const setFollow = (on) => followBtn.classList.toggle("on", on);
  const planesUI = { G, viewer, base, toggle: document.getElementById("t-planes"), status: document.getElementById("planes-status") };
  Layers.start({ viewer, canvas: document.getElementById("layer"), mpp: geo.mpp, onSelect: (h) => {
    Planes.deselect(); Transit.select(null);
    if (!h) { card.classList.remove("on"); return; }
    if (h.kind === "plane") { const show = () => { card.classList.add("on"); card.innerHTML = Planes.card(h); card.querySelector("[data-follow]").onclick = () => { Transit.unfollow(); setFollow(Planes.follow(h.p.id)); show(); }; }; show(); }
    else Transit.select(h);
  } });
  // ?box=south,west,north,east draws a work-area outline (used while deciding what to illustrate)
  const boxParam = (new URLSearchParams(location.search).get("box") || "").split(",").map(Number);
  const wa = geo.workArea, box = boxParam.length === 4 && boxParam.every(Number.isFinite) ? boxParam : wa ? [wa.south, wa.west, wa.north, wa.east] : null;
  if (box) Layers.add({ name: "box", draw: (ctx, view) => {
    const [s, w, n, e] = box, c = [[n, w], [n, e], [s, e], [s, w]].map(([la, lo]) => view.toScreen(...Object.values(G.toPixel(la, lo)).slice(0, 2)));
    ctx.save(); ctx.beginPath(); c.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
    ctx.fillStyle = "rgba(0,0,0,0)"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.stroke(); ctx.lineWidth = 2; ctx.setLineDash([10, 6]); ctx.strokeStyle = "#c0392b"; ctx.stroke();
    ctx.setLineDash([]); ctx.globalCompositeOperation = "destination-over"; ctx.restore();
    ctx.save(); ctx.font = "600 14px Inter, sans-serif"; ctx.fillStyle = "#c0392b"; ctx.strokeStyle = "rgba(255,253,248,.95)"; ctx.lineWidth = 4; const lbl = `work area · ${wa?.label ?? ""}  ${s},${w} → ${n},${e}`; ctx.strokeText(lbl, c[3][0] + 8, c[3][1] - 10); ctx.fillText(lbl, c[3][0] + 8, c[3][1] - 10); ctx.restore();
  } });
  Transit.start({ viewer, G, base, status: document.getElementById("status"), card, onFollow: (on) => { Planes.unfollow(); setFollow(on); },
    toggles: { rail: document.getElementById("t-rail"), bus: document.getElementById("t-bus"), stops: document.getElementById("t-stops") } });
  Planes.start(planesUI);
  Traffic.start({ G, base, toggle: document.getElementById("t-traffic") });
  Buildings.start({ G, base, viewer, tip: document.getElementById("tip") });
  viewer.addHandler("canvas-drag", () => { Transit.unfollow(); Planes.unfollow(); setFollow(false); });
  followBtn.onclick = () => { Transit.unfollow(); Planes.unfollow(); setFollow(false); };
})();
</script>
</body></html>
