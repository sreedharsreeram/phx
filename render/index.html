const P = Object.fromEntries(new URLSearchParams(location.search));

const DIST = 30000;
const camDir = new THREE.Vector3(0, -S, -C), camUp = new THREE.Vector3(0, C, -S);
const camera = window.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 2 * DIST + 5000);

const col = (hex) => new THREE.Color(hex);
const pal = geo.palette;
const hash = (s) => { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967295; };

const toShape = (o, holes) => { const sh = new THREE.Shape(o.map(([e, n]) => new THREE.Vector2(e, n))); for (const h of holes ?? []) sh.holes.push(new THREE.Path(h.map(([e, n]) => new THREE.Vector2(e, n)))); return sh; };
const flat = (items, color, y) => {
  const gs = [];
  for (const a of items) { try { const g = new THREE.ShapeGeometry(toShape(a.o, a.i)); g.rotateX(-Math.PI / 2); g.translate(0, y, 0); gs.push(g); } catch {} }

};
{
  const { e0, e1, n0, n1 } = geo.extent, g = new THREE.PlaneGeometry(e1 - e0 + 4000, n1 - n0 + 4000); g.rotateX(-Math.PI / 2); g.translate((e0 + e1) / 2, -0.5, -(n0 + n1) / 2);

const roads = scene.roads.filter((r) => r.c !== "steps");
const major = roads.filter((r) => !minor(r.c)), paths = roads.filter((r) => minor(r.c));

ribbon(major, (r) => r.w, (r) => col(service(r.c) ? pal.roadService : pal.road), (r) => 0.14 + r.z);
ribbon(paths, (r) => r.w, (r) => col(pal.path), (r) => 0.12);
ribbon(scene.aero, (r) => r.w + 3, (r) => col(pal.roadCasing), () => 0.1); ribbon(scene.aero, (r) => r.w, (r) => col(r.c === "runway" ? pal.runway : pal.apron), () => 0.14);

ribbon(scene.rails.flatMap((r) => [{ ...r, s: 1 }, { ...r, s: -1 }]).map((r) => ({ ...r, p: offsetLine(r.p, r.s * (r.k === "rail" ? 0.72 : 0.72)) })), () => 0.35, (r) => col(pal.rail), (r) => 0.24 + r.z);
function offsetLine(p, d) { const out = []; for (let i = 0; i < p.length; i++) { const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)]; const dx = b[0] - a[0], dn = b[1] - a[1], L = Math.hypot(dx, dn) || 1; out.push([p[i][0] - (dn / L) * d, p[i][1] + (dx / L) * d]); } return out; }

ribbon(roads.filter((r) => r.z > 0), (r) => r.w + 2.5, () => col(pal.bridgeShadow), () => 0.09);

// ---- buildings: extruded footprints, colour by hash with glassy towers, with dark edges
{
  const gs = [], edges = [];
  const palette = pal.buildings.map(col), tower = col(pal.tower);
  for (const b of scene.buildings) {
    try {

      const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false }); g.rotateX(-Math.PI / 2); g.translate(0, (b.m ?? 0) + 0.3, 0);
      const c = b.h > 45 ? tower : palette[Math.floor(hash(b.o[0][0] + "," + b.o[0][1]) * palette.length)];
      const n = g.attributes.position.count, cols = new Float32Array(n * 3);

      for (let i = 0; i < n; i++) { const up = nrm.getY(i) > 0.5; const k = up ? 1.06 : 1; cols[i * 3] = Math.min(1, c.r * k); cols[i * 3 + 1] = Math.min(1, c.g * k); cols[i * 3 + 2] = Math.min(1, c.b * k); }

  world.add(new THREE.LineSegments(BGU.mergeGeometries(edges, false), new THREE.LineBasicMaterial({ color: col(pal.edge), transparent: true, opacity: 0.55 })));
}

{
  const fol = new THREE.ConeGeometry(2.6, 5.5, 7); fol.translate(0, 5.2, 0); const trunk = new THREE.CylinderGeometry(0.35, 0.45, 2.6, 5); trunk.translate(0, 1.3, 0);

  world.add(mk(fol, pal.tree), mk(trunk, pal.trunk));
}
// ---- traffic signals: small dark posts with a lamp
{
  const g = new THREE.CylinderGeometry(0.25, 0.25, 6, 5); g.translate(0, 3, 0); const lamp = new THREE.BoxGeometry(0.9, 1.6, 0.9); lamp.translate(0, 6.3, 0);
  for (const [geom, c] of [[g, pal.pole], [lamp, pal.lamp]]) { const m = new THREE.InstancedMesh(geom, new THREE.MeshLambertMaterial({ color: col(c) }), scene.signals.length); const o = new THREE.Object3D(); scene.signals.forEach(([e, n], i) => { o.position.set(e, 0, -n); o.updateMatrix(); m.setMatrixAt(i, o.matrix); }); world.add(m); }
}

const pix = new Uint8Array((CHUNK / DEPTH_DIV) ** 2 * 4);
window.renderChunk = (px, py, w = CHUNK, h = CHUNK) => {
  const l = geo.x0 + px * geo.mpp, t = geo.y1 - py * geo.mpp;
  camera.left = l; camera.right = l + w * geo.mpp; camera.top = t; camera.bottom = t - h * geo.mpp; camera.updateProjectionMatrix();

  renderer.setRenderTarget(depthRT); renderer.setClearColor(0xffffff, 1); renderer.render(world, camera);

window.camInfo = { near: camera.near, far: camera.far, pos: camera.position.toArray(), dir: camDir.toArray() };
